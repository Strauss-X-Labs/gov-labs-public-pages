<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סרטון המחשת הקונספט | Gov-Labs מחזור 11</title>
  <style>
    :root {
      --bg: #0F1217;
      --border: #2D3748;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100dvh;
      background: var(--bg);
    }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }
    main {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }
    video {
      width: min(1080px, calc((100dvh - 32px) * 16 / 9), 100%);
      height: auto;
      aspect-ratio: 16 / 9;
      display: block;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden">סרטון המחשת הקונספט</h1>
    <video controls playsinline preload="metadata" width="1280" height="720" aria-label="סרטון המחשת הקונספט">
      <source src="concept-animation-video-naama-1.5x.mp4" type="video/mp4">
    </video>
  </main>
</body>
</html>
