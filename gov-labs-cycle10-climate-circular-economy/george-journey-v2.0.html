<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --green:#1f8a5b; --green-d:#166b45; --green-l:#2fb47a; --green-xl:#86d3ad; --green-soft:#e8f5ee;
  --ink:#2b2f33; --muted:#6b7479; --line:#e3e9e5; --bg:#f5f8f6;
  --warn:#d99a06; --warn-soft:#fdf2d6; --gold:#f5b301;
  --george:#3b4a5a; --supplier:#4f7cac;
  --dur:.7s; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:#e3e9e5;font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
b{font-weight:700}

/* ---------- player & stage ---------- */
#player{position:fixed;left:50%;top:50%;width:var(--PW,1600px);height:var(--PH,976px);transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
#stage{position:relative;width:var(--W,1600px);height:var(--H,900px);border-radius:24px;overflow:hidden;
  background:
    radial-gradient(circle at 88% 8%, rgba(47,180,122,.11), transparent 38%),
    radial-gradient(circle at 8% 92%, rgba(47,180,122,.09), transparent 42%),
    linear-gradient(180deg,#fbfdfc,#edf3ef);
  box-shadow:0 24px 70px rgba(25,55,40,.18),0 2px 6px rgba(0,0,0,.05)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(rgba(31,138,91,.11) 1.2px,transparent 1.5px);background-size:30px 30px}
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important}
.instant *,.instant *::before,.instant *::after{transition:none!important}

.view{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.view.on{opacity:1;visibility:visible;transition:opacity .6s ease .1s,visibility 0s}
.fill{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%)}
.pin.b{transform:translate(-50%,-100%)}
svg.full{position:absolute;inset:0;width:var(--W,1600px);height:var(--H,900px);overflow:visible}

/* ---------- generic reveal ---------- */
[data-at]{opacity:0;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
[data-a=up]{transform:translateY(28px)}
[data-a=drop]{transform:translateY(-70px)}
[data-a=scale]{transform:scale(.88)}
[data-a=pop]{transform:scale(.3);transition-timing-function:cubic-bezier(.34,1.56,.64,1)}
[data-a=fromR]{transform:translateX(40px)}
[data-a=fromL]{transform:translateX(-40px)}
[data-a=rise]{transform:translateY(300px);transition-duration:1.3s}
[data-a=zoomin]{transform:scale(.3);transition-duration:.9s}
[data-at].in{opacity:1;transform:none}

/* ---------- persona chip ---------- */
#persona{position:absolute;top:30px;right:36px;display:flex;align-items:center;gap:14px;background:#fff;border-radius:44px;padding:8px 8px 8px 24px;box-shadow:0 6px 22px rgba(20,50,35,.10);font-size:22px;opacity:0;transform:translateY(-14px);transition:opacity .6s var(--ease),transform .6s var(--ease);z-index:20}
#persona.on{opacity:1;transform:none}
#persona .p-txt{color:var(--muted)} #persona .p-txt b{color:var(--ink)}
.av{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;flex:none}
.av.george{background:#dce7f0;overflow:hidden}
.av.george svg,.av.big.george svg{width:100%;height:100%;display:block}
.av.md{width:52px;height:52px;font-size:24px}
.av.sm{width:38px;height:38px;font-size:18px}
.av.big{width:108px;height:108px;font-size:46px;border:5px solid #fff;box-shadow:0 10px 24px rgba(20,40,30,.16)}
.av.big svg{width:62px;height:62px;color:#fff}

/* ---------- captions ---------- */
.caps{position:absolute;left:0;right:0;bottom:40px;height:100px;z-index:15;pointer-events:none}
.cap{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:16px;font-size:44px;font-weight:700;letter-spacing:-.3px;opacity:0;transition:opacity .45s ease;
  text-shadow:0 0 18px #fff,0 0 8px #fff}
.cap.cur{opacity:1}
.cap .acc{color:var(--green)}

/* ---------- controls ---------- */
.controls{height:76px;display:flex;align-items:center;gap:14px;padding:16px 6px 0}
.btn{font-family:inherit;font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px;border:0;border-radius:30px;padding:10px 22px;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn.primary{background:var(--green);color:#fff}
.btn:focus-visible{outline:3px solid var(--green-xl);outline-offset:2px}
.btn svg{width:18px;height:18px}
.bar{flex:1;height:10px;background:rgba(0,0,0,.08);border-radius:6px;cursor:pointer;position:relative;overflow:hidden}
.bar-fill{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--green);border-radius:6px}
.time{font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:110px;text-align:center;direction:ltr}

/* ---------- scene 0 ---------- */
.fac-svg{overflow:visible;display:block}
.smoke circle{fill:#cfd8d3;opacity:0;transform-box:fill-box;transform-origin:center;animation:smoke 3s ease-out infinite}
.smoke circle:nth-child(2){animation-delay:1s} .smoke circle:nth-child(3){animation-delay:2s}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.85}100%{opacity:0;transform:translate(-14px,-34px) scale(2.4)}}
.factory-main{position:absolute;left:775px;top:190px;width:440px;text-align:center}
.factory-main svg{width:440px;height:367px}
.fac-label{font-size:26px;font-weight:700;color:var(--george);margin-top:6px}
.silo{position:absolute;left:1262px;top:315px;text-align:center;width:150px}
.silo-tank{position:relative;width:104px;height:230px;margin:0 auto;border:6px solid var(--george);border-radius:52px 52px 16px 16px;background:#fff;overflow:hidden}
.silo-fill{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(180deg,#f2c14e,var(--warn))}
.silo-pct{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--warn)}
.silo-label{margin-top:12px;font-size:20px;font-weight:600;color:var(--muted)}
.oldway{position:absolute;left:70px;top:255px;width:480px}
.ow-title{font-size:22px;color:var(--muted);margin-bottom:18px;font-weight:500}
.chip{position:relative;display:flex;align-items:center;gap:14px;width:max-content;background:#fff;border-radius:18px;padding:16px 26px;font-size:27px;font-weight:600;margin-bottom:18px;box-shadow:0 6px 18px rgba(20,50,35,.08)}
.chip::after{content:"";position:absolute;right:18px;left:18px;top:50%;height:3px;border-radius:2px;background:#d35454;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.oldway.on .chip.in{opacity:.5;filter:grayscale(1);transition:opacity .6s ease,filter .6s ease}
.oldway.on .chip::after{transform:scaleX(1)}
.oldway.on .chip:nth-of-type(2)::after{transition-delay:.15s}
.oldway.on .chip:nth-of-type(3)::after{transition-delay:.3s}

/* ---------- scenes 1-2: phone ---------- */
.pulses{position:absolute;left:800px;top:400px}
.pulses span{position:absolute;left:-180px;top:-180px;width:360px;height:360px;border-radius:50%;border:3px solid var(--green-l);opacity:0}
.pulses.on span{animation:ringout 2.4s ease-out infinite}
.pulses.on span:nth-child(2){animation-delay:.8s} .pulses.on span:nth-child(3){animation-delay:1.6s}
@keyframes ringout{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(1.9)}}
.phone-wrap{position:absolute;left:630px;top:44px;width:340px;height:706px;transform-origin:170px 300px}
.shake.on{animation:shake .45s ease-in-out 2}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px) rotate(-1.6deg)}40%{transform:translateX(5px) rotate(1.6deg)}60%{transform:translateX(-4px) rotate(-1deg)}80%{transform:translateX(3px) rotate(.8deg)}}
.phone-body{width:340px;height:706px;background:#15191c;border-radius:56px;padding:12px;box-shadow:0 30px 70px rgba(15,40,28,.28),inset 0 0 0 2px #2a3035}
.screen{position:relative;width:100%;height:100%;border-radius:45px;overflow:hidden;
  background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.18),transparent 40%),radial-gradient(circle at 90% 80%,rgba(134,211,173,.35),transparent 45%),linear-gradient(165deg,#2ea06d 0%,#1a6b4a 48%,#0e3a2a 100%)}
.island{position:absolute;top:12px;left:50%;width:104px;height:30px;margin-left:-52px;background:#0b0d0e;border-radius:20px}
.lock-time{margin-top:78px;text-align:center;color:#fff;font-size:86px;font-weight:300;letter-spacing:-2px;direction:ltr}
.lock-date{text-align:center;color:rgba(255,255,255,.85);font-size:20px;font-weight:500}
.notif{position:absolute;top:232px;left:12px;right:12px;background:rgba(255,255,255,.94);border-radius:22px;padding:14px 16px 16px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.nh{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
.nh .nt{margin-inline-start:auto;color:var(--muted)}
.app-ico{width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.app-ico svg{width:22px;height:22px}
.nb{margin-top:8px;font-size:19px;line-height:1.38;font-weight:500;color:var(--ink)}
.lock-hint{position:absolute;bottom:14px;left:50%;width:120px;height:5px;margin-left:-60px;border-radius:3px;background:rgba(255,255,255,.7)}
.finger{position:absolute;font-size:64px;line-height:1;opacity:0;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));z-index:5}
.ripple{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(31,138,91,.35);opacity:0;pointer-events:none}
.ripple.on{animation:ripple .8s ease-out forwards}
@keyframes ripple{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(6)}}

/* ---------- scenes 3-4: app ---------- */
.appwin{position:absolute;left:180px;top:36px;width:1240px;height:714px;background:#fff;border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(20,60,40,.16),0 2px 8px rgba(0,0,0,.05)}
.topbar{height:64px;display:flex;align-items:center;gap:30px;padding:0 26px;border-bottom:1px solid var(--line);background:#fbfdfc}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:var(--green)}
.brand-ico{width:36px;height:36px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.brand-ico svg{width:26px;height:26px}
.topbar nav{display:flex;gap:6px}
.topbar nav span{padding:7px 16px;border-radius:20px;font-size:17px;color:var(--muted);font-weight:500}
.topbar nav span.active{background:var(--green-soft);color:var(--green);font-weight:700}
.me{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:17px;color:var(--muted)}
.me b{color:var(--ink)}
.app-scale{position:absolute;inset:0}
.pages{position:absolute;top:64px;left:0;right:0;bottom:0}
.page-in{position:relative}
.page{position:absolute;inset:0;overflow:hidden;padding:20px 30px;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.p1.past{opacity:0;transform:translateX(70px)}
.p2{opacity:0;transform:translateX(-70px)}
.p2.cur,.p2.past{opacity:1;transform:none}
.op-head{display:flex;align-items:flex-end;justify-content:space-between;height:76px;margin-bottom:16px}
.crumb{font-size:17px;color:var(--green);font-weight:600;margin-bottom:4px}
.op-head h1{font-size:32px;font-weight:800;letter-spacing:-.4px}
.tags{display:flex;gap:10px;padding-bottom:6px}
.tag{display:inline-flex;align-items:center;border-radius:20px;padding:6px 16px;font-size:18px;font-weight:700;background:var(--green-soft);color:var(--green)}
.tag-green{background:var(--green);color:#fff}
.op-grid{display:grid;grid-template-columns:430px 1fr 400px;gap:20px;height:420px}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 4px 14px rgba(20,50,35,.05)}
.lbl{font-size:16px;font-weight:600;color:var(--muted);margin-bottom:8px}
.lbl.big{font-size:20px;color:var(--ink);font-weight:700;margin-bottom:14px}
.gallery{display:flex;gap:12px;padding:12px}
.tile{width:123px;height:123px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.tile svg{width:100%;height:100%;display:block}
.supplier{flex:1}
.sup-name{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700}
.sup-ico{width:52px;height:44px;flex:none}
.sup-ico svg{width:52px;height:44px}
.rating{display:flex;align-items:center;gap:14px;margin:16px 0 14px;transform-origin:right center;width:max-content}
.rating.on{animation:pop2 .6s ease-in-out 2}
@keyframes pop2{0%,100%{transform:none}50%{transform:scale(1.08)}}
.stars{display:flex;gap:2px;font-size:38px;line-height:1}
.star{position:relative;color:#e2e6e3}
.star .sf{position:absolute;top:0;right:0;width:0;overflow:hidden;color:var(--gold);white-space:nowrap}
.rnum{font-size:36px;font-weight:800;direction:ltr}
.rlbl{font-size:16px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--green-soft);color:var(--green-d);border:1.5px solid var(--green-xl);border-radius:22px;padding:7px 16px;font-size:18px;font-weight:700}
.badge svg{width:18px;height:18px}
.glowring{position:absolute;inset:-4px;border-radius:21px;border:3px solid var(--green);opacity:0;pointer-events:none}
.glowring.on{animation:glow 1.3s ease-out 2}
@keyframes glow{0%{opacity:1;box-shadow:0 0 0 0 rgba(31,138,91,.45)}100%{opacity:0;box-shadow:0 0 0 22px rgba(31,138,91,0)}}
.mapcard{flex:1;display:flex;flex-direction:column;align-items:center}
.mapcard .lbl{align-self:stretch}
.il{width:180px;height:292px;overflow:visible}
.il-shape{fill:#eef4f0;stroke:#b9cdc2;stroke-width:1.6;stroke-linejoin:round}
.il-route{stroke:var(--green);stroke-width:2.2;stroke-dasharray:4 4;fill:none}
.il-txt{font-size:14px;font-weight:700;fill:var(--ink);font-family:inherit}
.sup-ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{opacity:.6;transform:scale(.5)}100%{opacity:0;transform:scale(2.4)}}
.dist{font-size:30px;font-weight:800;color:var(--green);margin-top:auto}
.piecard{display:flex;flex-direction:column}
.pie-row{display:flex;align-items:center;gap:22px}
.pie{width:112px;height:112px;flex:none}
.legend{display:flex;flex-direction:column;gap:7px;font-size:18px}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.legend b{min-width:44px;direction:ltr;text-align:right}
.clean-top{display:flex;justify-content:space-between;align-items:baseline}
.clean-val{font-size:20px;font-weight:800;color:var(--green)}
.cbar{height:16px;border-radius:9px;background:#edf2ef;position:relative;overflow:hidden;margin:6px 0 6px}
.cbar-fill{position:absolute;top:0;bottom:0;right:0;width:0;border-radius:9px;background:linear-gradient(270deg,#f2c14e,#9bd27d 45%,var(--green))}
.cends{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.doccard{display:flex;align-items:center;gap:16px}
.doccard .lbl{position:absolute;top:12px;right:18px}
.doc-ico{width:44px;height:54px;flex:none;margin-top:18px}
.doc-txt{margin-top:18px}
.doc-txt b{font-size:21px;display:block;direction:ltr;text-align:right}
.doc-txt small{font-size:15px;color:var(--muted)}
.doc-dl{margin-inline-start:auto;margin-top:18px;width:42px;height:42px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:22px;font-weight:800}
.cta-row{display:flex;justify-content:flex-end;margin-top:16px;height:60px}
.cta-wrap{position:relative}
.cta{display:flex;align-items:center;gap:12px;background:var(--green);color:#fff;font-size:23px;font-weight:700;border-radius:16px;padding:14px 30px;box-shadow:0 8px 20px rgba(31,138,91,.3);transition:transform .15s ease}
.cta.on{animation:ctaPulse 1.1s ease-out 2}
@keyframes ctaPulse{0%{box-shadow:0 8px 20px rgba(31,138,91,.3),0 0 0 0 rgba(31,138,91,.45)}100%{box-shadow:0 8px 20px rgba(31,138,91,.3),0 0 0 20px rgba(31,138,91,0)}}
.share{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:9px 18px;font-size:18px;font-weight:600;margin-bottom:6px}
.an-grid{display:grid;grid-template-columns:360px 1fr 400px;gap:20px;height:490px}
.ringcard{display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-box{position:relative;width:250px;height:250px}
.ring{width:250px;height:250px}
.ring .track{fill:none;stroke:#e9f0eb;stroke-width:22}
.ring .prog{fill:none;stroke:var(--green);stroke-width:22;stroke-linecap:round}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center b{font-size:66px;font-weight:900;line-height:1;direction:ltr;color:var(--green)}
.ring-center span{font-size:22px;font-weight:600;color:var(--muted)}
.ring-note{margin-top:18px;font-size:18px;color:var(--muted);text-align:center}
.act{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.ai{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none}
.ai svg{width:26px;height:26px}
.ai.warn{background:var(--warn-soft);color:var(--warn)}
.ai.ok{background:var(--green-soft);color:var(--green)}
.act b{display:block;font-size:24px}
.act small{font-size:17px;color:var(--muted)}
.roi .roi-k{font-size:17px;color:var(--muted);font-weight:600}
.roi-v{display:flex;align-items:baseline;gap:10px;margin:2px 0 4px}
.roi-v b{font-size:50px;font-weight:900;color:var(--green);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.roi-v span{font-size:22px;color:var(--muted);font-weight:600}
.sep{height:1px;background:var(--line);margin:14px 0}
.roi-v2 b{font-size:40px;font-weight:900;color:var(--ink)}
.months{display:flex;gap:5px;margin-top:14px;height:30px}
.months span{flex:1;border-radius:6px;background:#eef2ef}
.months span.inv.in{background:#f2d58a}
.months span.gain.in{background:var(--green-l)}
.months span[data-at]{opacity:1;transition:background .35s ease}
.months-lbl{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}

/* ---------- scene 5: meeting ---------- */
.table{width:640px;height:280px;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#f6ecdc,#ead9bf);box-shadow:0 22px 40px rgba(90,60,20,.15),inset 0 -8px 0 rgba(160,120,70,.18)}
.mini{width:360px;background:#fff;border-radius:18px;padding:16px 20px;box-shadow:0 12px 30px rgba(20,50,35,.16)}
.mini-h{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--green);font-weight:700}
.mini-h .brand-ico{width:28px;height:28px;border-radius:8px}
.mini-h .brand-ico svg{width:20px;height:20px}
.mini-t{font-size:22px;font-weight:800;margin:8px 0 10px}
.mini-s{display:flex;gap:12px;align-items:center;font-size:17px;font-weight:600;color:var(--muted)}
.mini-s .tag{font-size:15px;padding:4px 12px}
.seat-in{display:flex;flex-direction:column;align-items:center;gap:8px}
.seat-in b{font-size:22px}
.seat-in small{font-size:16px;color:var(--muted);margin-top:-6px}
.bubble-in{position:relative;background:#fff;border-radius:20px;padding:12px 22px;font-size:25px;font-weight:600;white-space:nowrap;box-shadow:0 8px 24px rgba(20,50,35,.13);transform-origin:50% 100%}
.bubble-in::after{content:"";position:absolute;bottom:-11px;left:50%;margin-left:-11px;border:11px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble-in.g{background:var(--green);color:#fff}
.bubble-in.g::after{border-top-color:var(--green)}

/* ---------- scene 6: road ---------- */
.route{fill:none;stroke:#b4c6bc;stroke-width:6;stroke-dasharray:16 14;stroke-linecap:round}
.road-lbl{font-size:22px;font-weight:700;color:var(--ink);white-space:nowrap}
.dist-chip{background:#fff;border-radius:20px;padding:6px 18px;font-size:20px;font-weight:700;color:var(--green);box-shadow:0 4px 14px rgba(20,50,35,.1)}
.crate{width:84px;height:66px;border-radius:8px;background:linear-gradient(180deg,#d9a866,#c48f4b);border:3px solid #a8743a;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.25);opacity:0;box-shadow:0 8px 16px rgba(80,50,20,.2);position:relative}
.crate::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 46%,rgba(120,80,30,.35) 46% 54%,transparent 54%)}
.crate span{position:relative;background:rgba(0,0,0,.15);padding:0 6px;border-radius:4px}

/* ---------- scene 7: lab ---------- */
.lab-col{display:flex;flex-direction:column;align-items:center;gap:18px}
.lab-lbl{font-size:24px;font-weight:700;color:var(--muted);white-space:nowrap}
.bub{transform-box:fill-box;transform-origin:center;animation:bub 2s ease-in infinite;opacity:0}
.bub:nth-child(2){animation-delay:.6s}.bub:nth-child(3){animation-delay:1.2s}.bub:nth-child(4){animation-delay:.3s}
@keyframes bub{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-120px)}}
.gnum{font-size:56px;font-weight:900;color:var(--green);line-height:1;direction:ltr}
.gnum small{font-size:24px;color:var(--muted);font-weight:600}
.okc{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3cc285,var(--green) 60%,var(--green-d));box-shadow:0 22px 50px rgba(31,138,91,.35);display:grid;place-items:center}
.ok-lbl{font-size:40px;font-weight:900;color:var(--green)}

/* ---------- scene 8: deal ---------- */
.dline{stroke:var(--green);stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.dfac{display:flex;flex-direction:column;align-items:center;gap:6px}
.dfac > svg{width:260px;height:217px}
.dfac b{font-size:28px}
.dfac small{font-size:18px;color:var(--muted)}
.hs{width:170px;height:170px;border-radius:50%;background:#fff;border:6px solid var(--green);display:grid;place-items:center;font-size:90px;box-shadow:0 18px 44px rgba(31,138,91,.25)}
.confetti{position:absolute;left:800px;top:400px;width:0;height:0;pointer-events:none}
.confetti i{position:absolute;left:-6px;top:-9px;width:12px;height:18px;border-radius:3px;background:var(--c);opacity:0}
.confetti.on i{animation:conf var(--du) var(--de) cubic-bezier(.15,.7,.35,1) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}25%{opacity:1;transform:translate(var(--bx),var(--by)) rotate(calc(var(--r) * .3)) scale(1)}100%{opacity:0;transform:translate(calc(var(--bx) * 1.4),calc(var(--by) + 440px)) rotate(var(--r)) scale(1)}}

/* ---------- scene 9: loop ---------- */
.lline{stroke:var(--green-xl);stroke-width:2.5;stroke-dasharray:6 8;fill:none}
.ldot{fill:var(--green)}
.deal-node{display:flex;flex-direction:column;align-items:center;gap:4px}
.deal-node .dn{width:96px;height:96px;border-radius:50%;background:#fff;border:4px solid var(--green);display:grid;place-items:center;font-size:48px;box-shadow:0 10px 26px rgba(31,138,91,.22)}
.deal-node small{font-size:18px;font-weight:700;color:var(--green)}
.logo-node{position:absolute;left:800px;top:350px;width:0;height:0}
.logo-glow{position:absolute;left:-190px;top:-190px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(47,180,122,.35),rgba(47,180,122,0) 65%);opacity:0}
.logo-core{position:absolute;left:-100px;top:-100px;width:200px;height:200px;border-radius:50%;background:#fff;border:6px solid var(--green);display:grid;place-items:center;color:var(--green);box-shadow:0 18px 50px rgba(31,138,91,.25)}
.logo-core svg{width:120px;height:120px}
.orb-in{position:relative;display:flex;flex-direction:column;align-items:center}
.orb-in svg{width:96px;height:80px}
.orb-ring{position:absolute;left:50%;top:40px;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:4px solid var(--green);opacity:0}
.orb-ring.on{animation:orbRing 1.4s ease-out 2}
@keyframes orbRing{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.5)}}
.newb{position:absolute;bottom:88px;white-space:nowrap;background:var(--green);color:#fff;font-size:17px;font-weight:700;border-radius:14px;padding:5px 14px;box-shadow:0 6px 16px rgba(31,138,91,.3)}
.fly{position:absolute;left:0;top:0;display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 18px;font-size:19px;font-weight:600;white-space:nowrap;box-shadow:0 10px 28px rgba(20,50,35,.18);opacity:0;will-change:transform}
.fly b{color:var(--green)}

/* ---------- end ---------- */
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,rgba(47,180,122,.16),transparent 55%)}
.end-logo{width:150px;height:150px;border-radius:40px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 20px 50px rgba(31,138,91,.35);margin-bottom:28px}
.end-logo svg{width:104px;height:104px}
.end-name{font-size:96px;font-weight:900;color:var(--green);letter-spacing:-1.5px;line-height:1.1}
.end-tag{font-size:42px;font-weight:600;color:var(--ink);margin-top:18px}
.end-small{position:absolute;bottom:64px;font-size:22px;color:var(--muted);font-weight:500;letter-spacing:.3px}

/* ---------- George ---------- */
.george-fig{position:absolute}
.george-fig svg{position:relative;width:100%;height:auto;display:block}
.george-fig .shadow{position:absolute;left:12%;right:12%;bottom:-8px;height:18px;border-radius:50%;background:rgba(30,50,40,.14)}
.wow{position:absolute;top:-6px;left:66%;width:60px;height:60px;border-radius:50%;background:var(--green);color:#fff;font-size:40px;font-weight:900;display:grid;place-items:center;box-shadow:0 8px 20px rgba(31,138,91,.35);z-index:2}
.dname{display:flex;align-items:center;gap:10px}

/* ---------- lab coin ---------- */
.coin{position:relative;width:180px;height:180px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff3b0 0%,#ffd75e 26%,#f0b400 62%,#c98a00 100%);
  box-shadow:0 18px 40px rgba(201,138,0,.35),inset 0 0 0 8px rgba(255,255,255,.3),inset 0 0 0 13px rgba(201,138,0,.35)}
.coin span{position:relative;font-size:104px;font-weight:900;line-height:1;color:#8a5a00;text-shadow:0 2px 0 rgba(255,255,255,.55)}
.coin::after{content:"";position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:rotate(20deg)}
.coin.in::after{animation:shine 1.5s ease-in-out .4s 2}
@keyframes shine{0%{left:-60%}100%{left:130%}}
.coin-val{font-size:40px;font-weight:900;color:#b07a00;direction:ltr}
.coin-lbl{font-size:22px;font-weight:700;color:var(--muted);margin-top:-12px}

/* ---------- scene 10: convoy ---------- */
.road{fill:none;stroke:#d3dfd8;stroke-width:30;stroke-linecap:round}
.road-off{stroke:#e4e6e5}
.road-dash{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:14 14}
.tons{display:flex;align-items:baseline;justify-content:center;gap:14px;transform-origin:center}
.tons b{font-size:128px;font-weight:900;color:var(--green);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.tons span{font-size:52px;font-weight:800}
.tons-sub{font-size:42px;font-weight:700;text-align:center;margin-top:6px}
.lf-lbl{font-size:24px;font-weight:700;color:var(--muted);text-decoration:line-through;text-decoration-color:#d35454;text-decoration-thickness:3px}
.plus{position:absolute;left:0;top:0;font-size:30px;font-weight:900;color:var(--green);opacity:0;white-space:nowrap;direction:ltr}

/* ---------- start gate (shown when the browser blocks sound) ---------- */
.gate{position:absolute;left:0;top:0;width:var(--W,1600px);height:var(--H,900px);z-index:40;border-radius:24px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:rgba(245,249,247,.7);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);transition:opacity .45s ease}
.gate.hide{opacity:0;pointer-events:none}
.gate-btn{width:200px;height:200px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 20px 50px rgba(31,138,91,.4);animation:gatePulse 1.8s ease-out infinite}
.gate-btn svg{width:86px;height:86px;transform:translateX(6px)}
@keyframes gatePulse{0%{box-shadow:0 20px 50px rgba(31,138,91,.4),0 0 0 0 rgba(31,138,91,.45)}100%{box-shadow:0 20px 50px rgba(31,138,91,.4),0 0 0 36px rgba(31,138,91,0)}}
.gate-txt{font-size:46px;font-weight:800;color:var(--ink)}
.gate-sub{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:600;color:var(--green)}
.gate-sub svg{width:30px;height:30px}
.portrait .gate-btn{width:260px;height:260px}
.portrait .gate-btn svg{width:110px;height:110px}
.portrait .gate-txt{font-size:62px}
.portrait .gate-sub{font-size:38px}
.portrait .gate-sub svg{width:40px;height:40px}
.reduced .gate-btn{animation:none}

/* ---------- music button ---------- */
.btn.music.needs{animation:needs 1.6s ease-in-out infinite}
@keyframes needs{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.08),0 0 0 0 rgba(31,138,91,.45)}50%{box-shadow:0 2px 8px rgba(0,0,0,.08),0 0 0 9px rgba(31,138,91,0)}}

/* ==========================================================
   Portrait (phones held upright): 900×1500 frame, re-laid-out scenes
   ========================================================== */
.portrait .cap{flex-wrap:wrap;align-content:center;row-gap:4px;column-gap:14px;font-size:56px;line-height:1.22;padding:0 50px;text-align:center}
.portrait .caps{bottom:70px;height:260px}
.portrait #persona{top:34px;right:34px;font-size:30px;gap:16px;padding:8px 8px 8px 28px}
.portrait #persona .av.md{width:68px;height:68px}
.portrait .controls{height:190px;flex-wrap:wrap;justify-content:center;gap:20px 18px;padding:28px 10px 0}
.portrait .bar{order:-2;flex:1 1 620px;height:16px;border-radius:9px}
.portrait .time{order:-1;font-size:28px;min-width:170px}

<script>

  /* ---------- helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const eout = x => 1 - Math.pow(1 - x, 3);
  const lerp = (a, b, p) => a + (b - a) * p;
  const fmtNum = n => Math.round(n).toLocaleString("en-US");
  const fmt = s => String(s ?? "").replace(/\{(\w+)\}/g, (m, k) =>

    function click(t, lvl) { const g = vca(false, true); env(g, t, .001, lvl, 0, .045); const s = ctx.createBufferSource(); s.buffer = noise; const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2200; bp.Q.value = 2; s.connect(bp); bp.connect(g); s.start(t); s.stop(t + .07); }

    const endBeat = Math.ceil(SC.end.start / BEAT - 1e-6);
    function beat(k, at) {
      const vt = k * BEAT, lv = section(vt);
      if (lv === 5) {
        if (k === endBeat) { pad(at, [261.63, 329.63, 392, 493.88, 587.33], 3.4, .026); bass(at, 65.41, 3.2, .16); bell(at, 1046.5, .07); bell(at + .14, 1567.98, .05); }
        return;
      }
      const b = k % 4, ch = PROG[Math.floor(k / 4) % 4];
      if (b === 0) pad(at, ch.pad, BAR, lv === 0 ? .03 : lv === 1 ? .026 : .017);
      if (lv >= 2 && (b === 0 || b === 2)) bass(at, ch.bass, BEAT * 1.7, .15);
      if (lv === 1) { pluck(at, ch.arp[b], .09); if (b === 0 || b === 2) bass(at, ch.bass, BEAT * 1.7, .1); }
      if (lv >= 2) { pluck(at, ch.arp[(b * 2) % 4], .065); pluck(at + BEAT / 2, ch.arp[(b * 2 + 1) % 4], .05); }
      if (lv === 3) { if (b === 0 || b === 2) kick(at, .2); hat(at + BEAT / 2, .022); }
      if (lv === 4) { kick(at, .24); hat(at + BEAT / 2, .03); }
    }
    // short sound cues synced to on-screen moments
    const stings = [
      [SC.s1.start + 2.0,  at => { bell(at, 1318.51, .11); bell(at + .13, 1975.53, .09); }],          // notification
      [SC.s2.start + 1.3,  at => click(at, .35)],                                                    // tap
      [SC.s3.start + 12.3, at => click(at, .35)],                                                    // tap "full details"
      [SC.s7.start + 3.85, at => [783.99, 987.77, 1174.66, 1567.98].forEach((f, i) => bell(at + i * .08, f, .06))], // ✓
      [SC.s7.start + 4.7,  at => { bell(at, 2093, .07); bell(at + .09, 2637.02, .07); }],             // ₪ coin
      [SC.s8.start + 1.8,  at => [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => bell(at + i * .06, f, .055))] // deal
    ];
    for (let i = 0; i < TRUCKS.n; i++) stings.push([SC.s10.start + TRUCKS.start + i * TRUCKS.gap + TRUCKS.dur, at => pluck(at, PENTA[i % PENTA.length], .09)]);
    function range(from, to, toAudio) {
      for (let k = Math.ceil(from / BEAT - 1e-6); k * BEAT < to; k++) if (k * BEAT >= from && k * BEAT < DURATION) beat(k, toAudio(k * BEAT));
      for (const [vt, fn] of stings) if (vt >= from && vt < to) fn(toAudio(vt));
    }
    return { master, newBus, range };
  }

  const Music = { ctx: null, eng: null, el: null, on: true, unlocked: false, fresh: false, schedTo: null };
  const btnMusic = $("#btnMusic");
  const ICON_SOUND = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>`;
  const ICON_MUTE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>`;
  function updMusicBtn() {
    const needs = !Music.unlocked;
    btnMusic.classList.toggle("needs", needs);
    btnMusic.innerHTML = (needs || !Music.on ? ICON_MUTE : ICON_SOUND) + `<span>${needs ? TEXT.ui_music_enable : (Music.on ? TEXT.ui_music_on : TEXT.ui_music_off)}</span>`;
  }
  function musicInit() {
    if (Music.ctx || Music.el) return;
    try {
      if (MUSIC_URL) { Music.el = new Audio(MUSIC_URL); Music.el.preload = "auto"; Music.el.volume = MUSIC_VOLUME; }
      else {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        Music.ctx = new AC(); Music.eng = makeEngine(Music.ctx, Music.ctx.destination);
        Music.eng.master.gain.value = Music.on ? MUSIC_VOLUME : 0;
      }
    } catch (e) { console.warn(e); }
  }
  // called on every user gesture: the first one unlocks sound (browsers require a gesture)
  function musicUnlock() {
    musicInit();
    if (Music.ctx && Music.ctx.state !== "running" && (playing || !Music.unlocked)) Music.ctx.resume().catch(() => {});
    if (Music.unlocked) return;
    Music.unlocked = true; Music.fresh = true; Music.schedTo = null;
    setTimeout(() => Music.fresh = false, 600);
    updMusicBtn();
  }
  // does the browser let us play sound right now, without a click?
  function probeSound() {
    return new Promise(res => {
      musicInit();
      let done = false; const fin = ok => { if (!done) { done = true; res(ok); } };
      if (Music.el) { Music.el.play().then(() => { Music.el.pause(); fin(true); }).catch(() => fin(false)); setTimeout(() => fin(false), 800); return; }
      if (!Music.ctx) return fin(false);
      if (Music.ctx.state === "running") return fin(true);
      Music.ctx.resume().then(() => fin(Music.ctx.state === "running")).catch(() => fin(false));
      setTimeout(() => fin(Music.ctx.state === "running"), 450);
    });
  }
  function musicSetOn(v) {
    Music.on = v;
    if (Music.eng) Music.eng.master.gain.setTargetAtTime(v ? MUSIC_VOLUME : 0, Music.ctx.currentTime, .05);
    if (Music.el) Music.el.muted = !v;
    updMusicBtn();
  }
  function musicReset() {
    Music.schedTo = null;
    if (Music.eng) Music.eng.newBus();
    if (Music.el) { try { Music.el.currentTime = t; } catch (e) {} }
  }
  function musicTick() {
    if (!Music.unlocked) return;
    if (Music.el) {
      const el = Music.el;
      if (playing) {
        if (el.paused) { try { el.currentTime = t; } catch (e) {} el.play().catch(() => {}); }
        else if (Math.abs(el.currentTime - t) > .35) el.currentTime = t;
      } else if (!el.paused) el.pause();
      return;
    }
    const ctx = Music.ctx;
    if (!playing) { if (ctx.state === "running" && t < DURATION) ctx.suspend(); return; }
    if (ctx.state !== "running") { ctx.resume(); return; }
    if (Music.schedTo === null) Music.schedTo = t;
    const horizon = t + .3;
    if (horizon > Music.schedTo) {
      const now = ctx.currentTime, tt = t;
      Music.eng.range(Music.schedTo, horizon, vt => now + Math.max(0, vt - tt) + .02);
      Music.schedTo = horizon;
    }
  }
  ["pointerdown", "pointerup", "touchend", "click", "keydown"].forEach(ev => addEventListener(ev, musicUnlock, true));
  addEventListener("keydown", musicUnlock, true);
  btnMusic.addEventListener("click", () => { musicUnlock(); if (Music.fresh) { Music.fresh = false; musicSetOn(true); } else musicSetOn(!Music.on); });
  updMusicBtn();
  // test hook: render the soundtrack offline and return per-second [peak, rms]
  window.__renderMusic = async (from = 0, to = DURATION) => {
    const sr = 22050, oc = new OfflineAudioContext(2, Math.ceil((to - from + 4) * sr), sr);
    const e = makeEngine(oc, oc.destination); e.master.gain.value = MUSIC_VOLUME;
    e.range(from, to, vt => vt - from);
    const buf = await oc.startRendering(), d = buf.getChannelData(0), out = [];
    for (let s = 0; s < Math.floor(d.length / sr); s++) { let pk = 0, sum = 0; for (let i = s * sr; i < (s + 1) * sr; i++) { const v = Math.abs(d[i]); if (v > pk) pk = v; sum += v * v; } out.push([+pk.toFixed(3), +Math.sqrt(sum / sr).toFixed(3)]); }
    return out;
  };

  /* ---------- layouts: landscape (16:9) and portrait for phones (9:15) ---------- */
  const GEO = {
    landscape: {
      W: 1600, H: 900, PH: 976, phone: 1, portrait: false,
      loop: { cx: 800, cy: 350, rx: 400, ry: 235, d0: 605, d1: 455 },
      plus: { x: 1345, y: 190 },
      attrs: {
        "#s6hills": { d: "M0 660 C 300 610, 520 670, 800 650 S 1300 615, 1600 660 V900 H0Z" },
        "#s6sup": { x: 180, y: 440, width: 250, height: 208 },
        "#s6geo": { x: 1170, y: 440, width: 250, height: 208 },
        "#roadPath": { d: "M450 642 C 600 642, 640 600, 762 608 S 930 642, 1075 642" },
        "#dl1": { x1: 475, y1: 400, x2: 720, y2: 400 },
        "#dl2": { x1: 1125, y1: 400, x2: 880, y2: 400 },
        "#s10hills": { d: "M0 640 C 300 600, 520 650, 800 630 S 1300 600, 1600 640 V900 H0Z" },
        "#s10off1, #s10off2": { d: "M740 590 C 900 590, 980 740, 1210 750" },
        "#s10lf": { transform: "translate(0 0)" },
        "#s10bar": { transform: "translate(869 623) rotate(28)" },
        "#convoyPath, #s10dash": { d: "M360 590 L740 590 C 900 590, 960 400, 1225 400" },
        "#s10sup": { x: 120, y: 398, width: 240, height: 200 },
        "#s10geo": { x: 1225, y: 210, width: 240, height: 200 }
      }
    },
    portrait: {
      W: 900, H: 1500, PH: 1690, phone: 1.45, portrait: true,
      loop: { cx: 450, cy: 560, rx: 330, ry: 380, d0: 965, d1: 675 },
      plus: { x: 740, y: 400 },
      attrs: {
        "#s6hills": { d: "M0 770 C 200 740, 330 790, 450 775 S 700 745, 900 770 V1500 H0Z" },
        "#s6sup": { x: 20, y: 560, width: 250, height: 208 },
        "#s6geo": { x: 630, y: 560, width: 250, height: 208 },
        "#roadPath": { d: "M262 758 C 340 758, 370 718, 430 722 S 520 758, 590 758" },
        "#dl1": { x1: 300, y1: 600, x2: 370, y2: 600 },
        "#dl2": { x1: 600, y1: 600, x2: 530, y2: 600 },
        "#s10hills": { d: "M0 860 C 200 830, 330 880, 450 865 S 700 835, 900 860 V1500 H0Z" },
        "#s10off1, #s10off2": { d: "M410 848 C 520 848, 560 1010, 690 1040" },
        "#s10lf": { transform: "translate(-585 338)" },
        "#s10bar": { transform: "translate(494 884) rotate(35)" },
        "#convoyPath, #s10dash": { d: "M268 848 L410 848 C 540 848, 520 628, 640 628" },
        "#s10sup": { x: 25, y: 650, width: 250, height: 208 },
        "#s10geo": { x: 615, y: 430, width: 250, height: 208 }
      }
    }
  };
  let G = GEO.landscape, MODE = null;
  const p1in = $("#p1in"), p2in = $("#p2in");
  const SCROLL = { p1: [], p2: [] };
  // auto-scroll for the portrait app: at each time, scroll so that the element is fully visible
  function computeScroll() {
    if (!G.portrait) return;
    const target = (inner, el) => {
      const viewH = inner.parentElement.clientHeight, max = inner.offsetTop + inner.offsetHeight + 14 - viewH;
      return clamp(inner.offsetTop + el.offsetTop + el.offsetHeight + 14 - viewH, 0, Math.max(0, max));
    };
    SCROLL.p1 = [[5.0, $(".mapcard")], [8.2, $(".doccard")], [10.5, $(".cta-row")]].map(([tm, el]) => [tm, target(p1in, el)]);
    SCROLL.p2 = [[2.6, $(".actions")], [4.7, $(".roi")]].map(([tm, el]) => [tm, target(p2in, el)]);
  }
  function scrollAt(lt, steps) {
    let y = 0;
    for (const [tm, to] of steps) y = lerp(y, to, eio(seg(lt, tm, tm + .8)));
    return y;
  }
  function applyLayout() {
    const mode = innerWidth < innerHeight * .95 ? "portrait" : "landscape";
    if (mode === MODE) return false;
    MODE = mode; G = GEO[mode];
    document.body.classList.toggle("portrait", G.portrait);
    const rs = document.documentElement.style;
    rs.setProperty("--W", G.W + "px"); rs.setProperty("--H", G.H + "px");
    rs.setProperty("--PW", G.W + "px"); rs.setProperty("--PH", G.PH + "px");
    $$("[data-lp]").forEach(el => {
      const v = (G.portrait ? el.dataset.pp : el.dataset.lp).split(",");
      el.style.left = v[0] + "px"; el.style.top = v[1] + "px";
      if (v[2]) el.style.width = v[2] + "px";
    });
    $$("svg.full").forEach(sv => sv.setAttribute("viewBox", `0 0 ${G.W} ${G.H}`));
    for (const sel in G.attrs) $$(sel).forEach(el => { for (const k in G.attrs[sel]) el.setAttribute(k, G.attrs[sel][k]); });
    roadLen = road.getTotalLength(); convoyLen = convoyPath.getTotalLength();
    const L = G.loop;
    LC = { x: L.cx, y: L.cy };
    logoNode.style.left = L.cx + "px"; logoNode.style.top = L.cy + "px";
    orbPos = ORB_ANG.map(a => ({ x: L.cx + L.rx * Math.cos(a * Math.PI / 180), y: L.cy + L.ry * Math.sin(a * Math.PI / 180) }));
    orbPos.forEach((p, i) => {
      orbPins[i].style.left = p.x.toFixed(0) + "px"; orbPins[i].style.top = p.y.toFixed(0) + "px";
      const ln = orbLines[i];
      ln.setAttribute("x1", L.cx); ln.setAttribute("y1", L.cy); ln.setAttribute("x2", p.x.toFixed(0)); ln.setAttribute("y2", p.y.toFixed(0));
    });
    computeScroll();
    fit();
    return true;
  }
  applyLayout();

  /* ---------- render ---------- */
  const barFill = $("#barFill"), timeEl = $("#time");
  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  const totalTxt = mmss(DURATION);
  function render(t) {
    let i = 0;
    for (let k = 0; k < SCENES.length; k++) if (t >= SCENES[k].start) i = k;
    const cur = SCENES[i];
    views.forEach(v => { const on = v.el.id === cur.view; if (on !== v.st) { v.st = on; v.el.classList.toggle("on", on); } });
    const pOn = !!cur.persona && t >= .6;
    if (pOn !== persona.st) { persona.st = pOn; persona.el.classList.toggle("on", pOn); }
    for (const it of items) { const s = t >= it.T; if (s !== it.st) { it.st = s; it.el.classList.toggle(it.cls, s); } }
    for (const c of conts) {
      const isCur = c.sc.id === cur.id, isPast = t >= c.sc.end;
      if (isCur !== c.cur) { c.cur = isCur; c.el.classList.toggle("cur", isCur); }
      if (isPast !== c.past) { c.past = isPast; c.el.classList.toggle("past", isPast); }
    }
    for (const id in TICKS) TICKS[id](t - SC[id].start);
    barFill.style.width = (t / DURATION * 100) + "%";
    timeEl.textContent = `${mmss(t)} / ${totalTxt}`;
  }

  /* ---------- clock & controls ---------- */
  let t = 0, playing = false, last = null;
  const btnPlay = $("#btnPlay");
  const ICON_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>`;
  const ICON_PAUSE = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>`;
  const gate = $("#gate");
  const gateOpen = () => !gate.classList.contains("hide");
  function startWithMusic() { musicUnlock(); musicSetOn(true); gate.classList.add("hide"); seek(0); setPlaying(true); }
  gate.addEventListener("click", e => { e.stopPropagation(); startWithMusic(); });
  function setPlaying(p) {
    if (p) gate.classList.add("hide");
    playing = p; last = null;
    stage.classList.toggle("paused", !p);
    btnPlay.innerHTML = (p ? ICON_PAUSE : ICON_PLAY) + `<span>${p ? TEXT.ui_pause : TEXT.ui_play}</span>`;
  }
  function seek(x) {
    t = clamp(x, 0, DURATION);
    musicReset();
    stage.classList.add("instant");
    render(t);
    void stage.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove("instant")));
  }
  function restart() { seek(0); setPlaying(true); }
  function frame(now) {
    if (playing) {
      if (last !== null) t += Math.min(.1, (now - last) / 1000);
      last = now;
      if (t >= DURATION) { t = DURATION; setPlaying(false); }
    }
    render(t);
    musicTick();
    requestAnimationFrame(frame);
  }
  btnPlay.addEventListener("click", () => { if (gateOpen()) startWithMusic(); else if (!playing && t >= DURATION) restart(); else setPlaying(!playing); });
  $("#btnRestart").addEventListener("click", restart);
  stage.addEventListener("click", () => btnPlay.click());
  $("#bar").addEventListener("click", e => {
    const r = e.currentTarget.getBoundingClientRect();
    seek((r.right - e.clientX) / r.width * DURATION); // RTL: fills from the right
  });
  document.addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); btnPlay.click(); }
    else if (e.key === "r" || e.key === "R" || e.key === "ר") restart();
  });

  /* ---------- fit to window ---------- */
  function fit() { player.style.setProperty("--s", Math.min(innerWidth / G.W, innerHeight / G.PH) * .98); }
  addEventListener("resize", () => { if (applyLayout()) seek(t); else fit(); });
  if (window.visualViewport) visualViewport.addEventListener("resize", () => { if (applyLayout()) seek(t); else fit(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { computeScroll(); render(t); });

  /* ---------- start ---------- */
  const q = new URLSearchParams(location.search);
  setPlaying(false);
  seek(0);
  requestAnimationFrame(frame);
  if (q.has("t")) { seek(parseFloat(q.get("t")) || 0); }
  else {
    // music is on by default: start right away if the browser allows sound, otherwise show a one-tap start screen
    const go = ok => {
      if (playing || t !== 0) return;
      if (ok) { Music.unlocked = true; updMusicBtn(); setPlaying(true); }
      else { seek(3.5); gate.classList.remove("hide"); }
    };
    (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(probeSound).then(go);
  }
  window.__seek = s => { seek(s); setPlaying(false); };
  window.__ctxState = () => Music.ctx ? Music.ctx.state : (Music.el ? "element" : "none");
})();
</script>
