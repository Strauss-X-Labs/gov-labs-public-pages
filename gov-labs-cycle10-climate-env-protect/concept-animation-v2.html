<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדגמת קונספט — בקרת נתוני ניטור אוויר</title>
<style>
  :root{
    --bg:#F6F5F1; --ink:#1F2A2E; --muted:#5E6B68; --accent:#1F6F68; --accent-soft:#D7E9E6;
    --amber:#C9821F; --amber-soft:#F6E6CC; --gray:#A7B0AE; --frame:#3A4744; --panel:#FFFFFF;
    --font:"Assistant","Rubik","Heebo","Arial Hebrew",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#E9E7E1;color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
  #frame{position:relative;width:min(100vw - 16px, (100vh - 96px) * 16 / 9);aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:var(--bg);box-shadow:0 10px 30px rgba(31,42,46,.12)}
  #stage{position:absolute;top:0;right:0;width:1600px;height:900px;transform-origin:top right}
  #art{position:absolute;inset:0;width:1600px;height:900px}
  .cap{position:absolute;top:40px;left:290px;right:290px;text-align:center;font-size:64px;font-weight:700;line-height:1.2;color:var(--ink);opacity:0;will-change:opacity,transform}
  .chip{position:absolute;top:44px;right:40px;font-size:38px;font-weight:700;color:var(--accent);background:var(--panel);border-radius:999px;padding:6px 24px;box-shadow:0 2px 8px rgba(31,42,46,.08);direction:ltr}
  .tag{position:absolute;top:50px;left:40px;font-size:26px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.75);border-radius:999px;padding:6px 18px}
  .legend{position:absolute;top:676px;left:450px;width:500px;display:flex;justify-content:center;gap:30px;font-size:36px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.85);border-radius:999px;padding:8px 26px;opacity:0;box-shadow:0 2px 8px rgba(31,42,46,.08)}
  .legend span{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .legend i{width:22px;height:22px;border-radius:50%;display:inline-block;flex:none}
  .bubble{position:absolute;font-size:52px;font-weight:700;line-height:1.25;padding:22px 34px;border-radius:30px;opacity:0;will-change:opacity,transform;box-shadow:0 6px 18px rgba(31,42,46,.12)}
  #bTech{background:var(--panel);color:var(--ink);border:3px solid var(--gray);top:430px;right:210px}
  #bSvc{background:var(--accent);color:#fff;top:470px;left:200px;right:330px;text-align:center}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:rgba(246,245,241,.94);text-align:center;padding:40px}
  .overlay[hidden]{display:none}
  .overlay h1{font-size:64px;margin:0;font-weight:700}
  .overlay p{font-size:34px;margin:0;color:var(--muted)}
  .overlay p.lead{font-size:44px;color:var(--ink);font-weight:600}
  .big{font-family:var(--font);font-size:40px;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:22px 64px;cursor:pointer;min-height:44px}
  .big:focus-visible,#controls button:focus-visible,#seek:focus-visible{outline:4px solid var(--amber);outline-offset:3px}
  #controls{width:min(100vw - 16px, (100vh - 96px) * 16 / 9);display:flex;align-items:center;gap:10px;direction:rtl}
  #controls button{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:18px;cursor:pointer;flex:none;display:grid;place-items:center}
  #seek{flex:1;accent-color:var(--accent);height:44px;min-width:0;direction:ltr}
  #time{font-size:15px;color:var(--muted);flex:none;direction:ltr;font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
</style>
</head>

  captions: [
    { from: 0.6,  to: 5.8,  text: "שמונה בבוקר. נתונים מכל התחנות והארובות." },
    { from: 6.3,  to: 10.0, text: "כל ערוץ נבדק ביד, אחד אחרי השני." },
    { from: 10.2, to: 13.8, text: "מה שקרה אחרי הבדיקה, מתגלה למחרת." },
    { from: 14.5, to: 17.8, text: "אותו יום. השירות מנטר יחד איתכם, כל הזמן." },
    { from: 18.0, to: 21.8, text: "כל נתון נבדק ברגע שהוא מגיע." },
    { from: 22.4, to: 26.0, text: "02:00 · התרעה חמורה עולה מיד למנהל." },
    { from: 26.2, to: 29.8, text: "המנהל מחליט ומפעיל את הגורמים הרלוונטיים." },
    { from: 30.4, to: 33.3, text: "בבוקר מחכה לרכזת תור קצר לבקרה." },
    { from: 33.4, to: 36.2, text: "מה שלא הוכרע, וסימנים לבעיה שמתקרבת." },
    { from: 36.3, to: 38.9, text: "כל נתון חשוד מגיע עם הסבר." },
    { from: 39.4, to: 42.5, text: "מכשיר תקול בתחנה: נפתחת תקלה מול הטכנאי." },
    { from: 47.4, to: 50.8, text: "הנתון המאומת מתפרסם. בביטחון." },
    { from: 51.2, to: 57.8, text: "אותו יום. הפעם הניטור לא עוצר." }
  ],
  bubbles: [
    { who: "tech", from: 42.6, to: 44.3, text: "אני תיקנתי" },
    { who: "svc",  from: 44.4, to: 46.9, text: "לא, לא תיקנת, הלחץ עדיין שמונה מאות" }
  ]
};

/* ===== ENGINE: one timeline; everything is computed from t ===== */
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeIO = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const prog = (t, a, b) => { const p = clamp((t - a) / (b - a), 0, 1); return REDUCED ? (p > 0 ? 1 : 0) : easeIO(p); };
const win = (t, a, b, f = .35) => REDUCED ? (t >= a && t < b ? 1 : 0) : Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
const hx = h => 1450 - (h / 24) * 1300;            /* RTL: 00:00 at the right */

/* hour labels */
[0,6,12,18,24].forEach(h => { const tx = document.createElementNS(NS, "text"); tx.setAttribute("x", hx(h)); tx.setAttribute("y", 862); tx.textContent = String(h).padStart(2,"0") + ":00"; $("hours").appendChild(tx); });

/* monitor grid for the manual check: 40 channels */
const cells = [], COLS = 8, ROWS = 5, SILENT_CELL = 9;
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const g = document.createElementNS(NS, "rect");
  g.setAttribute("x", 886 - c * 56); g.setAttribute("y", 262 + r * 64); g.setAttribute("width", 46); g.setAttribute("height", 46); g.setAttribute("rx", 7);
  $("gridG").appendChild(g); cells.push(g);
}
const cursor = document.createElementNS(NS, "rect");
cursor.setAttribute("width", 54); cursor.setAttribute("height", 54); cursor.setAttribute("rx", 9); cursor.setAttribute("fill", "none"); cursor.setAttribute("stroke", "#1F2A2E"); cursor.setAttribute("stroke-width", 5);
$("gridG").appendChild(cursor);

/* calm overview: small rows of dots */
for (let r = 0; r < 5; r++) for (let c = 0; c < 9; c++) {
  const d = document.createElementNS(NS, "circle");
  d.setAttribute("cx", 880 - c * 48); d.setAttribute("cy", 290 + r * 62); d.setAttribute("r", 13);
  d.setAttribute("fill", (r === 1 && c === 6) ? "#C9821F" : "#1F6F68"); d.setAttribute("opacity", ".85");
  $("calmG").appendChild(d);
}

/* trend screen bars */
const BAR_H = [30, 48, 38, 62], bars = BAR_H.map((h, i) => { const b = document.createElementNS(NS, "rect"); b.setAttribute("x", 62 + i * 38); b.setAttribute("width", 24); b.setAttribute("rx", 4); $("bars").appendChild(b); return b; });

/* polylines -> measurable paths */
const parse = id => {
  const pts = $(id).getAttribute("points").trim().split(/\s+/).map(s => s.split(",").map(Number));
  const segs = []; let len = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); segs.push({ a: pts[i-1], b: pts[i], l, s: len }); len += l; }
  return { segs, len };
};
const at = (p, s) => { const d = s * p.len; for (const g of p.segs) if (d <= g.s + g.l) { const k = (d - g.s) / g.l; return [g.a[0] + (g.b[0]-g.a[0])*k, g.a[1] + (g.b[1]-g.a[1])*k]; } const e = p.segs[p.segs.length-1].b; return e; };

/* data dots: 0 stack, 1 station A, 2 station B, 3-4 smaller sources */
const paths = ["p0","p1","p2","p3","p4"].map(parse);
const DOTS_PER = [10, 10, 10, 6, 6], dots = [];
paths.forEach((p, pi) => { for (let k = 0; k < DOTS_PER[pi]; k++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("r", 9); $("dots").appendChild(c); dots.push({ pi, k, n: DOTS_PER[pi], el: c }); } });
const GATE_X = 1100;

/* outflow dots */
const outs = ["o0","o1"].map(parse), OUT_PER = 8, outDots = [];
outs.forEach((p, pi) => { for (let k = 0; k < OUT_PER; k++) { const c = document.createElementNS(NS, "circle"); c.setAttribute("r", 9); c.setAttribute("fill", "#1F6F68"); $("outDots").appendChild(c); outDots.push({ pi, k, el: c }); } });

function sceneAt(t) { return FILM.scenes.find(s => t >= s.start && t < s.end) || FILM.scenes[FILM.scenes.length - 1]; }
function clockText(t) {
  const s = sceneAt(t); const [a, b] = s.clock;
  const toMin = x => { const [h, m] = x.split(":").map(Number); return h * 60 + m; };
  const m = Math.round(toMin(a) + (toMin(b) - toMin(a)) * clamp((t - s.start) / (s.end - s.start), 0, 1));
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}
const op = (id, v) => $(id).setAttribute("opacity", v);

function render(t) {
  const svc = t >= 14;                              /* the service exists from scene 3 */
  const nightK = t < 14 ? 0 : (t < 30 ? prog(t, 14, 14.8) * (1 - prog(t, 29.4, 30.2)) : 0);
  op("night", (nightK * 0.10).toFixed(3));
  op("gate", svc ? prog(t, 14.2, 15.2) : 0);
  op("dim", (nightK * 0.35).toFixed(3));
  $("legend").style.opacity = t >= 15.2 ? (prog(t, 15.2, 15.8) * (1 - prog(t, 46.4, 47))).toFixed(2) : 0;

  /* people */
  const ellaOn = t < 14 ? prog(t, 0, .8) : (t >= 30 ? prog(t, 30, 30.8) : 1 - prog(t, 14, 14.6));
  $("ella").setAttribute("opacity", ellaOn);
  const lean = REDUCED ? 0 : Math.sin(t * 2.2) * 2;
  $("ellaArm").setAttribute("transform", (t >= 47.6 && t < 48.4) ? "translate(-6,6)" : `rotate(${lean},150,190)`);
  op("mgr", win(t, 22.3, 30, .5));
  const ringP = REDUCED ? 0 : ((t - 24.6) % 1.1) / 1.1;
  op("ring", t > 24.6 && t < 27 ? (1 - ringP).toFixed(2) : 0);
  $("ring").setAttribute("r", 30 + ringP * 40);
  $("phoneScr").setAttribute("fill", t > 24.5 && t < 30 ? "#C9821F" : "#3A4744");
  op("parties", win(t, 26.2, 30, .4));
  ["l0","l1","l2"].forEach((id, i) => { const p = prog(t, 26.3 + i * .35, 27.2 + i * .35); const L = 260; $(id).setAttribute("stroke-dasharray", L); $(id).setAttribute("stroke-dashoffset", (L * (1 - p)).toFixed(1)); });
  op("tech", win(t, 39.8, 47, .5));
  $("wrench").setAttribute("transform", `translate(150,170) rotate(${t > 45 && t < 46.4 && !REDUCED ? Math.sin(t * 18) * 25 : 0})`);
  const stuck = t >= 39.6 && t < 46.5;
  op("stRing", stuck ? (REDUCED ? 1 : (.55 + .45 * Math.sin(t * 5)).toFixed(2)) : 0);

  /* monitor content */
  const gridOn = t < 14 ? 1 - prog(t, 13.6, 14) : 0;
  op("gridG", gridOn);
  const k = clamp((t - 6.3) / 7.2, 0, 1), idx = Math.min(cells.length - 1, Math.floor(k * cells.length));
  cells.forEach((c, i) => {
    const checked = t >= 6.3 && i < idx;
    const silent = i === SILENT_CELL && t >= 10.6;  /* already-checked channel goes silent at 08:30 */
    c.setAttribute("fill", silent ? "#A7B0AE" : (checked ? "#5E6B68" : "#E3E7E6"));
  });
  const cc = cells[t < 6.3 ? 0 : idx];
  cursor.setAttribute("x", +cc.getAttribute("x") - 4); cursor.setAttribute("y", +cc.getAttribute("y") - 4);
  cursor.setAttribute("opacity", t >= 6.3 && t < 13.6 ? 1 : 0);
  op("calmG", (t >= 15 && t < 30 ? prog(t, 15, 16) : 0) || (t >= 39 && t < 47 ? prog(t, 39, 39.6) : 0) || (t >= 51 ? prog(t, 51, 51.6) : 0));
  op("queueG", win(t, 30.3, 39.2, .4));
  ["card0","card1","card2"].forEach((id, i) => { const p = prog(t, 30.6 + i * .5, 31.3 + i * .5); $(id).setAttribute("opacity", p); $(id).setAttribute("transform", `translate(${(1 - p) * -40},0)`); });
  op("explain", prog(t, 36.1, 36.7));
  op("approveG", win(t, 47, 51.4, .4));
  $("btn").setAttribute("transform", t >= 47.6 && t < 48.0 ? "translate(700,535) scale(.94) translate(-700,-535)" : "");

  /* destinations (scene 7) */
  const destOn = t >= 47 ? prog(t, 47.3, 47.9) : 0;
  op("pub", destOn); op("ana", destOn);
  $("pubWave").setAttribute("stroke-dasharray", 1); $("pubWave").setAttribute("stroke-dashoffset", (1 - prog(t, 48.3, 51)).toFixed(3));
  bars.forEach((b, i) => { const h = BAR_H[i] * prog(t, 48.6 + i * .35, 49.4 + i * .35); b.setAttribute("y", (300 - h).toFixed(1)); b.setAttribute("height", h.toFixed(1)); });
  $("trend").setAttribute("stroke-dasharray", 1); $("trend").setAttribute("stroke-dashoffset", (1 - prog(t, 49.6, 52)).toFixed(3));
  const outK = t >= 47.8 ? prog(t, 47.8, 48.2) * (1 - prog(t, 53, 53.6)) : 0;
  op("outPaths", outK.toFixed(2));
  outDots.forEach(d => {
    const phase = REDUCED ? d.k / OUT_PER : (t - 48) * .3 - d.k / OUT_PER;
    const vis = phase >= 0 ? outK : 0;
    const [x, y] = at(outs[d.pi], ((phase % 1) + 1) % 1);
    d.el.setAttribute("cx", x.toFixed(1)); d.el.setAttribute("cy", y.toFixed(1)); d.el.setAttribute("opacity", vis.toFixed(2));
  });

  /* source status lights: 0 stack, 1 station A (silent in B), 2 station B (stuck in scene 6) */
  ["sd0","sd1","sd2"].forEach((id, i) => {
    let f = "#A7B0AE";
    if (svc) f = "#1F6F68";
    if (i === 2 && stuck) f = "#C9821F";
    if (i === 1 && t >= 10.6 && t < 14) f = "#D9DEDD";
    $(id).setAttribute("fill", f);
  });

  /* data dots: gray until the check band, then reliable or suspicious */
  dots.forEach(d => {
    const p = paths[d.pi]; const speed = REDUCED ? 0 : .085;
    const s = ((t * speed + d.k / d.n) % 1 + 1) % 1;
    let vis = 1;
    if (d.pi === 1 && t >= 10.6 && t < 14) vis = 0;            /* silent station, nobody notices */
    if (d.pi === 2 && stuck) vis = 0;                          /* stuck instrument */
    if (t >= 47.4 && t < 52.5) vis = .35;
    const [x, y] = at(p, s);
    let fill = "#8C9694";
    if (svc && x < GATE_X) fill = (d.pi === 0 && d.k === 4) ? "#C9821F" : "#1F6F68";
    d.el.setAttribute("cx", x.toFixed(1)); d.el.setAttribute("cy", y.toFixed(1));
    d.el.setAttribute("fill", fill); d.el.setAttribute("opacity", (vis * (t < 0.4 ? 0 : 1)).toFixed(2));
  });

  /* severe alert at 02:00: from the check band to the manager */
  if (t >= 22.4 && t < 26) {
    const a = prog(t, 23.2, 24.6);
    const P = [[1100,443],[990,215],[420,215],[322,610]];
    const seg = a * 3, i = Math.min(2, Math.floor(seg)), f = seg - i;
    const x = P[i][0] + (P[i+1][0]-P[i][0]) * f, y = P[i][1] + (P[i+1][1]-P[i][1]) * f;
    $("alarm").setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    const pulse = REDUCED ? 0 : (t * 1.6) % 1;
    $("alarmRing").setAttribute("r", 20 + pulse * 30); $("alarmRing").setAttribute("opacity", (1 - pulse).toFixed(2));
    op("alarm", 1 - prog(t, 24.6, 25.2));
  } else op("alarm", 0);

  /* fault ticket: station B -> technician next to it */
  if (t >= 40 && t < 42.6) {
    const a = prog(t, 40.2, 41.6);
    const x = 1495 + (1340 - 1495) * a, y = 566 + (640 - 566) * a - Math.sin(a * Math.PI) * 80;
    $("ticket").setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    op("ticket", 1 - prog(t, 41.8, 42.4));
  } else op("ticket", 0);

  /* 24h strips */
  op("stripToday", t < 14 ? 1 - prog(t, 13.6, 14) : prog(t, 51, 51.8));
  $("tCheck").setAttribute("cx", hx(8)); op("tCheck", t >= 1 ? 1 : 0);
  const gapP = t < 14 ? prog(t, 10.4, 11.4) : 1;
  const gw = (hx(8.5) - hx(24)) * gapP;
  $("tGap").setAttribute("x", (hx(8.5) - gw).toFixed(1)); $("tGap").setAttribute("width", gw.toFixed(1)); op("tGap", gapP > 0 ? 1 : 0);
  op("tTomorrow", gapP);
  $("stripToday").setAttribute("transform", t >= 51 ? `translate(0,${(-70 * prog(t, 51, 51.8)).toFixed(1)})` : "");
  op("stripSvc", svc ? prog(t, 14.3, 15) : 0);
  let hh = 0;
  if (t >= 14) { const c = clockText(t).split(":").map(Number); hh = c[0] + c[1] / 60; }
  if (t >= 30) hh = Math.max(hh, 8);
  if (t >= 47) hh = 9.5 + (24 - 9.5) * prog(t, 51.8, 55);
  const fw = (hx(0) - hx(hh)); $("sFill").setAttribute("x", (hx(0) - fw).toFixed(1)); $("sFill").setAttribute("width", Math.max(0, fw).toFixed(1));
  $("m02").setAttribute("cx", hx(2)); op("m02", t >= 23.4 ? 1 : 0); $("m02").setAttribute("fill", t >= 28 ? "#1F6F68" : "#C9821F"); $("m02").setAttribute("stroke", "#fff"); $("m02").setAttribute("stroke-width", 4);
  $("m08").setAttribute("cx", hx(8)); op("m08", t >= 30.4 ? 1 : 0);
  $("m0830").setAttribute("cx", hx(8.5)); op("m0830", t >= 39.6 ? 1 : 0); $("m0830").setAttribute("fill", t >= 46.5 ? "#1F6F68" : "#C9821F");

  /* text layers */
  const cap = FILM.captions.find(c => t >= c.from && t < c.to);
  const capEl = $("cap");
  if (cap) { if (capEl.textContent !== cap.text) capEl.textContent = cap.text; const o = win(t, cap.from, cap.to, .3); capEl.style.opacity = o; capEl.style.transform = REDUCED ? "" : `translateY(${(1 - o) * 10}px)`; }
  else capEl.style.opacity = 0;
  FILM.bubbles.forEach(b => { const el = $(b.who === "tech" ? "bTech" : "bSvc"); if (el.textContent !== b.text) el.textContent = b.text; const o = win(t, b.from, b.to, .3); el.style.opacity = o; el.style.transform = REDUCED ? "" : `scale(${.94 + .06 * o})`; });
  $("clock").textContent = clockText(t);
}

/* ===== PLAYER ===== */
let t = 0, playing = false, last = 0;
const seek = $("seek"), timeEl = $("time"), btnPlay = $("btnPlay");
const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function draw() { render(t); seek.value = t.toFixed(1); timeEl.textContent = fmt(t) + " / " + fmt(FILM.duration); btnPlay.textContent = playing ? "❚❚" : "▶"; }
function frame(now) {
  if (!playing) return;
  t += (now - last) / 1000; last = now;
  if (t >= FILM.duration) { t = FILM.duration; playing = false; $("endOv").hidden = false; draw(); return; }
  draw(); requestAnimationFrame(frame);
}
function play() { if (t >= FILM.duration) t = 0; $("startOv").hidden = true; $("endOv").hidden = true; playing = true; last = performance.now(); requestAnimationFrame(frame); draw(); }
function pause() { playing = false; draw(); }
function restart() { t = 0; play(); }
$("playBig").addEventListener("click", play);
$("replayBig").addEventListener("click", restart);
btnPlay.addEventListener("click", () => playing ? pause() : play());
$("btnRestart").addEventListener("click", restart);
seek.addEventListener("input", () => { t = +seek.value; $("startOv").hidden = true; $("endOv").hidden = t < FILM.duration; if (playing) last = performance.now(); draw(); });
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target.tagName !== "BUTTON") { e.preventDefault(); playing ? pause() : play(); } });

/* fit the 1600x900 stage into the frame */
function fit() { const w = $("frame").clientWidth; $("stage").style.transform = `scale(${w / 1600})`; }
window.addEventListener("resize", fit); fit();

/* testing aid: #t=12.5 opens paused at that second */
const m = location.hash.match(/t=([\d.]+)/);
if (m) { t = clamp(+m[1], 0, FILM.duration); $("startOv").hidden = true; }
draw();
</script>
</body>
