<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Deevo · הדגמת קונספט</title>
<style>
  :root {
    --bg: #F7F5F0; --ink: #1B2A4A; --muted: #6B7280; --amber: #E0A544; --teal: #2F7D78;
    --card: #FFFFFF; --line: #DCD7CC; --page: #ECE8DF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); color-scheme: light; }
  body {
    font-family: "Assistant", "Rubik", "Heebo", "Arial Hebrew", Arial, sans-serif;
    min-height: 100vh; padding: 16px; display: flex; flex-direction: column; justify-content: center;
  }
  .player { width: 100%; max-width: min(1280px, calc((100vh - 110px) * 16 / 9)); min-width: 0; margin: 0 auto; }
  @media (max-width: 700px) { .player { max-width: 100%; } }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--bg);
    border-radius: 14px; overflow: hidden; container-type: inline-size;
    box-shadow: 0 10px 30px rgba(27, 42, 74, 0.12);
  }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag {
    position: absolute; top: 2.2cqw; left: 2.2cqw; font-size: clamp(10px, 1.5cqw, 16px);
    color: var(--muted); background: rgba(255,255,255,0.75); padding: 0.15em 0.7em; border-radius: 999px;
  }
  .cap {
    position: absolute; top: max(5.2cqw, 30px); right: 6cqw; left: 6cqw; text-align: center;
    font-size: clamp(15px, 3.5cqw, 44px); font-weight: 700; line-height: 1.3; color: var(--ink);
    opacity: 0; will-change: opacity, transform;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6cqw; background: rgba(247, 245, 240, 0.94); text-align: center; padding: 4cqw;
  }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-size: clamp(22px, 5.5cqw, 64px); font-weight: 800; letter-spacing: -0.01em; }
  .overlay p { margin: 0; font-size: clamp(13px, 2cqw, 22px); color: var(--muted); }
  .big-btn {
    font: inherit; font-weight: 700; font-size: clamp(14px, 2.2cqw, 24px); color: #fff; background: var(--ink);
    border: 0; border-radius: 999px; padding: 0.55em 1.6em; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5em;
  }
  .big-btn:focus-visible, .ctl:focus-visible, input[type=range]:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 10px; direction: ltr; }
  .ctl {
    flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #fff;
    color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .ctl svg { width: 18px; height: 18px; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--ink); height: 28px; }
  .time { flex: none; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; min-width: 84px; text-align: center; }
  svg text { font-family: "Assistant", "Rubik", "Heebo", "Arial Hebrew", Arial, sans-serif; }
</style>
</head>

<script>
/* ===== התוכן: סצנות, זמנים וטקסטים ===== */
const DATA = {

const $ = (id) => document.getElementById(id);

const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);

const SOUND = {

  musicFrom: 0.4, musicTo: 56.7,

  bars: [

const Sfx = (() => {

    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 2.5;
    master = ctx.createGain(); master.gain.value = muted ? 0 : 1;

  function env(g, at, peak, attack, decay) {
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay);
  }

  function mallet(f, at, v = 0.03, decay = 0.5) {
    const g = ctx.createGain(); g.connect(master); env(g, at, v, 0.005, decay);
    const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f; o.connect(g);
    const g2 = ctx.createGain(); g2.connect(master); env(g2, at, v * 0.25, 0.003, decay * 0.25);
    const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 4; o2.connect(g2);

    const g = ctx.createGain(); g.connect(master); env(g, at, v, 0.02, 1.1);

    flag:  (at) => { mallet(880, at, 0.035, 0.3); mallet(739.99, at + 0.15, 0.035, 0.45); },
    chime: (at) => { mallet(1174.66, at, 0.04, 0.8); mallet(1479.98, at + 0.08, 0.03, 0.9); },

  };

    const st = SOUND.step;
    for (let k = Math.floor(prev / st) + 1; k * st <= tt; k++) {

      const bar = SOUND.bars[Math.floor(k / 8) % 4], i = k % 8;
      const at = base + Math.max(0, time - tt);
      const fadeIn = Math.min(1, (time - SOUND.musicFrom) / 2.4);

    start() { init(); if (ctx && ctx.state === "suspended") ctx.resume(); },
    stop() {},
    seek() {},
    advance(prev, tt) {

    get muted() { return muted; }
  };

// בלי תליאת: כל סצנה מוצגת במצב המיושב שלה, ומתחלפת בחיתוך
function shown(tt) {
  if (!reduce) return tt;
  const s = DATA.scenes.find(x => tt >= x.start && tt < x.end) || DATA.scenes[DATA.scenes.length - 1];
  const settle = { 1: 4, 2: 7, 3: 15.6, 4: 21.5, 5: 27.5, 6: 33, 7: 41.5, 8: 46.5, 9: 51.5, 10: 55.5 }[s.n];
  return settle;
}
function draw() {
  render(shown(t));
  seek.value = t.toFixed(2);
  timeEl.textContent = `${fmt(t)} / ${fmt(DATA.duration)}`;
}
function setPlaying(p) {
  playing = p;
  $("icoPlay").style.display = p ? "none" : "";
  $("icoPause").style.display = p ? "" : "none";
  $("playBtn").setAttribute("aria-label", p ? "השהיה" : "ניגון");
  if (p) { last = null; Sfx.start(t); requestAnimationFrame(tick); } else { Sfx.stop(); }
}
function tick(now) {
  if (!playing) return;
  if (last === null) last = now;
  const prev = t;
  t = clamp(t + Math.max(0, now - last) / 1000, 0, DATA.duration);
  last = now;
  Sfx.advance(prev, t);
  draw();
  if (t >= DATA.duration) { setPlaying(false); $("endOverlay").hidden = false; return; }
  requestAnimationFrame(tick);
}
function start(from = 0) {
  t = from; $("startOverlay").hidden = true; $("endOverlay").hidden = true; draw(); setPlaying(true);
}
$("startBtn").onclick = () => start(0);
$("replayBtn").onclick = () => start(0);
$("restartBtn").onclick = () => start(0);
$("playBtn").onclick = () => {
  if (!$("startOverlay").hidden) return start(0);
  if (t >= DATA.duration) return start(0);
  setPlaying(!playing);
};
seek.oninput = () => {
  t = +seek.value; $("startOverlay").hidden = true; $("endOverlay").hidden = t < DATA.duration; Sfx.seek(t); draw();
};
function syncMute() {
  const m = Sfx.muted;
  $("icoSound").style.display = m ? "none" : ""; $("icoMute").style.display = m ? "" : "none";
  $("muteBtn").setAttribute("aria-pressed", String(m)); $("muteBtn").setAttribute("aria-label", m ? "ביטול השתקה" : "השתקה");
}
$("muteBtn").onclick = () => { Sfx.toggleMute(); syncMute(); };
syncMute();
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !(e.target instanceof HTMLInputElement)) { e.preventDefault(); $("playBtn").click(); }
});

// לבדיקות: ‎#t=12.5 פותח את הסרטון עצור בשנייה הזו
const m = location.hash.match(/t=([\d.]+)/);
if (m) { t = Math.min(DATA.duration, +m[1]); $("startOverlay").hidden = true; }
draw();
</script>
</body>
